<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JamBoard</title>
    <style>
        :root {
            --bg: #111; --grid-bg: #222;
            --red: #ff3366; --yellow: #ffcc00; --blue: #00ccff; --green: #33ff66; --purple: #cc33ff;
            --active-col: rgba(255, 255, 255, 0.1);
        }
        body { background-color: var(--bg); color: #fff; font-family: monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #controls { margin-bottom: 10px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1100px; align-items: center; }
        button { padding: 10px 20px; background: #444; color: #fff; border: none; cursor: pointer; font-family: monospace; font-size: 14px; border-radius: 4px; font-weight: bold; }
        button:hover { background: #666; }
        button:disabled { background: #222; color: #555; cursor: not-allowed; }
        #btn-play-grid { background: var(--green); color: #000; }
        #btn-play-grid:disabled { background: #1a4d29; color: #555; }
        #btn-play-song { background: var(--yellow); color: #000; }
        #btn-stop { background: var(--red); color: #fff; }
        #btn-kit { background: var(--blue); color: #000; }
        .slider-container { display: flex; align-items: center; gap: 10px; background: #333; padding: 10px 15px; border-radius: 4px; }
        .instructions { font-size: 12px; color: #888; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; text-align: center; line-height: 1.5;}
        .highlight { color: #fff; }
        
        #main-workspace { display: flex; gap: 30px; width: 100%; max-width: 1200px; justify-content: center; align-items: flex-start; }
        #main-workspace.locked { pointer-events: none; opacity: 0.7; }
        #left-panel { display: flex; flex-direction: column; align-items: center; width: 100%;}
        
        #palette { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; padding: 15px; background: var(--grid-bg); border-radius: 8px; align-items: center; justify-content: center; width: 100%; box-sizing: border-box;}
        .palette-divider { width: 2px; height: 30px; background: #444; margin: 0 5px; }
        
        .theory-controls { display: flex; gap: 10px; align-items: center; }
        .theory-controls select { background: #111; color: var(--yellow); border: 2px solid #555; padding: 6px 10px; border-radius: 4px; font-family: monospace; font-weight: bold; font-size: 12px; cursor: pointer; text-transform: uppercase; outline: none; transition: 0.1s;}
        .theory-controls select:hover { border-color: #888; }
        
        .block { width: 50px; height: 50px; cursor: grab; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; user-select: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); overflow: hidden; position: relative; border: 3px solid transparent; box-sizing: border-box; transition: border-color 0.1s;}
        .block.dragging { opacity: 0.5; }
        .block[data-color="red"] { background: var(--red); }
        .block[data-color="yellow"] { background: var(--yellow); }
        .block[data-color="blue"] { background: var(--blue); }
        .block[data-color="green"] { background: var(--green); }
        .block[data-color="purple"] { background: var(--purple); }

        .block .pitch-val { position: relative; z-index: 2; pointer-events: none;}
        .block .vol-bar { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.25); z-index: 1; transition: height 0.1s; pointer-events: none;}

        .fx-token { width: 45px; height: 20px; border-radius: 4px; color: #fff; font-size: 9px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: grab; border: 2px solid #888; box-shadow: 0 2px 5px rgba(0,0,0,0.5); user-select: none; position: relative; overflow: hidden;}
        .fx-token.dragging { opacity: 0.5; }
        .fx-token[data-fx="crush"] { background: #522; border-color: #f66; }
        .fx-token[data-fx="echo"] { background: #225; border-color: #66f; }
        .fx-token[data-fx="reverb"] { background: #552; border-color: #aa4; }
        .fx-token[data-fx="chorus"] { background: #255; border-color: #4aa; }
        .fx-token .fx-label { position: relative; z-index: 2; pointer-events: none;}
        .fx-bar { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.3); z-index: 1; pointer-events: none; transition: height 0.1s; }
        
        #grid { display: grid; grid-template-columns: 100px repeat(8, 70px) 70px; grid-template-rows: repeat(5, minmax(85px, auto)); gap: 5px; padding: 15px; border-radius: 12px; transition: background-color 0.1s ease-out; background-color: transparent; }
        .row-controls { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding-right: 15px; gap: 5px; }
        .row-label { font-size: 12px; color: #ccc; font-weight: bold; text-transform: uppercase; }
        .row-volume { width: 70px; cursor: pointer; accent-color: var(--green); }
        
        .cell { background: var(--grid-bg); border: 1px solid #333; border-radius: 4px; display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; padding: 5px 18px; gap: 2px; position: relative; }
        .cell.active { background: var(--active-col); }
        
        .cell .block { width: 100%; height: 20px; cursor: pointer; font-size: 10px; position: relative; z-index: 2;}
        
        .cell .fx-token { position: absolute; width: 12px; height: 35px; z-index: 1; color: transparent; border-radius: 2px; border-width: 1px;}
        .cell .fx-token .fx-label { display: none; }
        .cell .fx-token[data-fx="crush"] { left: 3px; top: 5px; }
        .cell .fx-token[data-fx="echo"] { left: 3px; bottom: 5px; }
        .cell .fx-token[data-fx="reverb"] { right: 3px; top: 5px; }
        .cell .fx-token[data-fx="chorus"] { right: 3px; bottom: 5px; }
        .cell .fx-token[data-fx="crush"]::after { content: "C"; color: #fff; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;}
        .cell .fx-token[data-fx="echo"]::after { content: "E"; color: #fff; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;}
        .cell .fx-token[data-fx="reverb"]::after { content: "R"; color: #fff; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;}
        .cell .fx-token[data-fx="chorus"]::after { content: "H"; color: #fff; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;}
        
        .row-fx-slot { background: #1a1a1a; border: 2px solid #444; border-radius: 4px; display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; gap: 4px; padding: 5px; position: relative; }
        .row-fx-slot::before { content: "ROW FX"; position: absolute; top: -15px; font-size: 9px; color: #666; font-weight: bold; width: 100%; text-align: center; }

        #right-panel { display: flex; flex-direction: column; gap: 20px; width: 250px; }
        .panel-box { background: var(--grid-bg); border: 1px solid #444; border-radius: 8px; padding: 15px; display: flex; flex-direction: column;}
        .panel-title { font-size: 12px; color: #888; margin-bottom: 10px; text-transform: uppercase; }
        #loop-bank { display: flex; flex-wrap: wrap; gap: 10px; overflow-y: auto; align-content: flex-start; min-height: 150px; }
        #song-bank { display: flex; flex-wrap: wrap; gap: 10px; overflow-y: auto; align-content: flex-start; min-height: 150px; }
        
        .loop-token { width: 50px; height: 50px; background: #111; border-radius: 4px; display: flex; gap: 2px; padding: 4px; cursor: grab; border: 2px solid #555; overflow: hidden; transition: transform 0.1s; user-select: none; }
        .loop-token:hover { transform: scale(1.05); }
        .mini-col { display: flex; flex-direction: column-reverse; flex: 1; gap: 1px; justify-content: flex-start; }
        .mini-block { width: 100%; height: 4px; border-radius: 1px; }

        .song-token { width: 50px; height: 50px; background: var(--yellow); color: #000; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border: 2px solid #fff; user-select: none; transition: 0.1s;}
        .song-token:hover { transform: scale(1.05); }
        
        #bottom-panel { width: 100%; max-width: 1200px; margin-top: 20px; }
        .timeline-row { display: flex; gap: 10px; overflow-x: auto; padding: 15px; background: var(--grid-bg); border-radius: 8px; min-height: 60px; border: 1px solid #444; }
        .timeline-slot { width: 60px; height: 60px; flex-shrink: 0; border: 2px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.1s; }
        .timeline-slot:hover { border-color: #888; background: rgba(255,255,255,0.05); }
        .timeline-slot.active-macro { border-color: var(--yellow); background: rgba(255, 204, 0, 0.15); border-style: solid;}
        .timeline-slot .loop-token { width: 100%; height: 100%; border: none; padding: 2px; }
    </style>
</head>
<body>

    <div id="controls">
        <button id="btn-play-grid">PLAY GRID</button>
        <button id="btn-play-song">PLAY SONG</button>
        <button id="btn-stop">STOP</button>
        <button id="btn-kit">ACTIVE KIT: TECHNO</button>
        <button id="btn-clear">CLEAR GRID</button>
        <button id="btn-save">SAVE LOOP</button>
        <button id="btn-save-new" style="display: none; background: var(--blue); color: #000;">SAVE AS NEW</button>
        <div class="slider-container">
            <label for="bpm-slider">BPM: <span id="bpm-display">110</span></label>
            <input type="range" id="bpm-slider" min="60" max="200" value="110">
        </div>
    </div>
    
    <div class="instructions">
        <span class="highlight">PITCH:</span> Click/Scroll on Blocks *
        <span class="highlight">VOL / FX MIX:</span> Scroll/Click on Blocks or Tokens *
        <span class="highlight">REMOVE:</span> Shift-Click or Drag
    </div>

    <div id="main-workspace">
        <div id="left-panel">
            <div id="palette">
                
                <div class="block" draggable="true" data-type="block" data-color="red"><span class="pitch-val">R</span></div>
                <div class="block" draggable="true" data-type="block" data-color="yellow"><span class="pitch-val">Y</span></div>
                <div class="block" draggable="true" data-type="block" data-color="blue"><span class="pitch-val">B</span></div>
                <div class="block" draggable="true" data-type="block" data-color="green"><span class="pitch-val">G</span></div>
                <div class="block" draggable="true" data-type="block" data-color="purple"><span class="pitch-val">P</span></div>
                
                <div class="palette-divider"></div>
                
                <div class="fx-token" draggable="true" data-type="fx" data-fx="crush" data-amount="1.0">
                    <div class="fx-bar" style="height: 100%"></div><span class="fx-label">CRUSH</span>
                </div>
                <div class="fx-token" draggable="true" data-type="fx" data-fx="echo" data-amount="1.0">
                    <div class="fx-bar" style="height: 100%"></div><span class="fx-label">ECHO</span>
                </div>
                <div class="fx-token" draggable="true" data-type="fx" data-fx="reverb" data-amount="1.0">
                    <div class="fx-bar" style="height: 100%"></div><span class="fx-label">REVERB</span>
                </div>
                <div class="fx-token" draggable="true" data-type="fx" data-fx="chorus" data-amount="1.0">
                    <div class="fx-bar" style="height: 100%"></div><span class="fx-label">CHORUS</span>
                </div>

                <div class="palette-divider"></div>

                <div class="theory-controls">
                    <select id="sel-key">
                        <option value="60">C</option><option value="61">Db / C#</option>
                        <option value="62">D</option><option value="63">Eb / D#</option>
                        <option value="64">E</option><option value="65">F</option>
                        <option value="66">Gb / F#</option><option value="67">G</option>
                        <option value="68">Ab / G#</option><option value="69">A</option>
                        <option value="70">Bb / A#</option><option value="71">B</option>
                    </select>
                    <select id="sel-scale">
                        <option value="MINOR PENT">Min Pent</option>
                        <option value="PENTATONIC">Maj Pent</option>
                        <option value="MINOR">Minor</option>
                        <option value="MAJOR">Major</option>
                        <option value="BLUES">Blues</option>
                    </select>
                    <select id="sel-rhythm">
                        <option value="STRAIGHT">Straight</option>
                        <option value="SWING">Swing</option>
                        <option value="HEAVY_SWING">Heavy Swing</option>
                    </select>
                </div>
            </div>
            <div id="grid"></div>
        </div>
        <div id="right-panel">
            <div class="panel-box"><div class="panel-title">Loop Bank</div><div id="loop-bank"></div></div>
            <div class="panel-box"><div class="panel-title">Song Bank</div><div id="song-bank"></div></div>
        </div>
    </div>

    <div id="bottom-panel">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px;">
            <div class="panel-title" style="margin-left: 5px; margin-bottom: 0;">Song Timelines</div>
            <div style="display: flex; gap: 10px;">
                <button id="btn-add-timeline" style="background: var(--blue); color: #000; padding: 5px 10px;">+ TIMELINE</button>
                <button id="btn-remove-timeline" style="background: var(--red); padding: 5px 10px;">- TIMELINE</button>
            </div>
        </div>
        
        <div id="timeline-container" style="display: flex; flex-direction: column; gap: 5px;"></div>
        
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button id="btn-save-song" style="background: var(--purple); color: #fff;">SAVE SONG</button>
            <button id="btn-clear-song">CLEAR TIMELINES</button>
        </div>
    </div>

    <script src="audioEngine.js"></script>
    <script src="app.js"></script>

</body>
</html>
